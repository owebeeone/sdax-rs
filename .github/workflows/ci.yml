name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Check workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.96.0
      - run: cargo fetch --locked
      - run: python3 -B scripts/check_all.py

  # Measure consumer library compatibility. Dev dependencies use the current
  # test toolchain; the Rust 1.75 promise covers the published libraries.
  msrv:
    name: MSRV 1.75 library builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.75 --profile minimal
      - run: cargo +1.75 fetch --locked
      - run: python3 -B scripts/check_all.py --msrv-only

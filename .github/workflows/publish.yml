name: Publish sdax to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to verify
        required: true

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: read

concurrency:
  group: sdax-crates-io
  cancel-in-progress: false

jobs:
  select:
    name: Resolve release source
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag_object: ${{ steps.resolve.outputs.tag_object }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: resolve
        run: python3 -B scripts/release_selection.py select

  test:
    name: Check selected source
    runs-on: ubuntu-latest
    needs: select
    env:
      RELEASE_SHA: ${{ needs.select.outputs.sha }}
      RELEASE_TAG_OBJECT: ${{ needs.select.outputs.tag_object }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.select.outputs.sha }}
      - run: python3 -B scripts/release_selection.py verify
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.96.0
      - run: cargo fetch --locked
      - run: python3 -B scripts/check_all.py

  msrv:
    name: Build selected libraries on Rust 1.75
    runs-on: ubuntu-latest
    needs: select
    env:
      RELEASE_SHA: ${{ needs.select.outputs.sha }}
      RELEASE_TAG_OBJECT: ${{ needs.select.outputs.tag_object }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.select.outputs.sha }}
      - run: python3 -B scripts/release_selection.py verify
      - run: rustup toolchain install 1.75 --profile minimal
      - run: cargo +1.75 fetch --locked
      - run: python3 -B scripts/check_all.py --msrv-only

  publish:
    name: Publish verified source
    runs-on: ubuntu-latest
    needs: [select, test, msrv]
    environment: crates-io
    env:
      RELEASE_SHA: ${{ needs.select.outputs.sha }}
      RELEASE_TAG_OBJECT: ${{ needs.select.outputs.tag_object }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.select.outputs.sha }}
      - run: python3 -B scripts/release_selection.py verify
      - run: rustup toolchain install 1.96.0 --profile minimal
      - run: rustup default 1.96.0
      - run: cargo fetch --locked
      - name: Verify archives and publish in dependency order
        run: python3 -B scripts/publish_release.py
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
